# On any source change, tell the consuming apps -- font-proofer, ReCal, wordmarktools --
# to rebuild + redeploy, so a primitive tweak reaches wordmark without manually bumping
# each app.
# No-ops until the WORDMARK_DEPLOY_TOKEN4 secret is added (a PAT that can dispatch to the apps).
name: Notify consumers
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.ts'
      - 'fonts/**'      # the canonical Cal Sans lives here; a rebuild must follow it
jobs:
  dispatch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # wordmarktools, not opsz-proofer: the tool is a directory inside that repo, and
        # a dispatch addresses a repo. Its deploy-opsz-proofer.yml already listens for
        # primitive-updated and has been waiting on this line.
        repo: [font-proofer, ReCal, wordmarktools]
    steps:
      - name: Trigger ${{ matrix.repo }} deploy
        env:
          TOKEN: ${{ secrets.WORDMARK_DEPLOY_TOKEN4 }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::WORDMARK_DEPLOY_TOKEN4 is not set — ${{ matrix.repo }} was NOT told to rebuild."
            echo "A green run here previously meant 'dispatched OR silently skipped', which is"
            echo "indistinguishable from a successful deploy. Failing loudly instead."
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/MarkFonts/${{ matrix.repo }}/dispatches" \
            -d '{"event_type":"primitive-updated"}'
