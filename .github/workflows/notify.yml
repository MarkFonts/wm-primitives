# On any source change, tell the consuming apps (font-proofer, ReCal) to rebuild +
# redeploy, so a primitive tweak reaches wordmark without manually bumping each app.
# No-ops until the DISPATCH_TOKEN secret is added (a PAT that can dispatch to the apps).
name: Notify consumers
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.ts'
jobs:
  dispatch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: [font-proofer, ReCal]
    steps:
      - name: Trigger ${{ matrix.repo }} deploy
        env:
          TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "DISPATCH_TOKEN not set — skipping. Add the secret to enable auto-deploy."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/MarkFonts/${{ matrix.repo }}/dispatches" \
            -d '{"event_type":"primitive-updated"}'
