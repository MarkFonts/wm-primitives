name: lint-tokens

# The system is only a system if drifting off it fails something. Every rule this checks
# was cleaned up by hand once; without this the next literal goes in unnoticed.
on:
  push:
    paths:
      - 'src/**'
      - 'scripts/lint-tokens.mjs'
      - '.tokenlint.json'
      # The faces job watches docs/fonts/, NOT fonts/. A `calbuild --bump` writes
      # fonts/ and stops; docs-fonts.yml rebuilds the copy a minute later. Watching
      # fonts/ here would fail the bump commit in that gap -- a failure notification
      # for something that has not failed, and is about to be handled. What is left
      # for this job is the case nothing automates: a docs/fonts/ copy edited by hand,
      # and every PR (the pull_request trigger carries no paths filter).
      - 'docs/fonts/**'
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: node scripts/lint-tokens.mjs

  # A PR that changes what ships -- src/, index.ts, dist/ -- carries a CHANGELOG entry, or
  # it is red. The log went silent for a night once (CHANGELOG 2026-09-17: five inserts
  # that no-op'd on a stale anchor) and nobody noticed until the entries were rebuilt
  # from the PRs; this is the check that would have noticed. Docs-only and test-only PRs
  # are exempt: the log is a log of decisions, not of diffs.
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: A change to what ships has a CHANGELOG entry
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$changed"
          if echo "$changed" | grep -qE '^(src/|index\.ts$|dist/)'; then
            if ! echo "$changed" | grep -qx 'CHANGELOG.md'; then
              echo "::error file=CHANGELOG.md::this PR changes src/, index.ts or dist/ and CHANGELOG.md has no entry -- write what moved and what it cost (newest first, under a dated heading)"
              exit 1
            fi
            echo "CHANGELOG.md changed -- ok"
          else
            echo "nothing that ships changed -- no entry required"
          fi

  # docs/fonts/ is a build-time copy of the faces `calbuild --bump` publishes into
  # fonts/, and docs/system/build.py makes the copy. But nothing runs build.py in CI, so
  # a bump lands in fonts/ and the docs page keeps serving the old face until somebody
  # happens to rebuild. That is exactly how it went 27 days stale (issue #6) -- the copy
  # alone shortens that window, it does not close it.
  #
  # This closes it: a bump that does not carry a rebuilt docs/ fails here, loudly, on the
  # commit that caused it, instead of being discovered by measuring a live page.
  faces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: docs/fonts must match the published fonts
        run: |
          fail=0
          # Keep in step with SYNCED_FACES in docs/system/build.py.
          for name in CalSansVF.ttf; do
            a=$(sha256sum "fonts/$name"      | cut -d' ' -f1)
            b=$(sha256sum "docs/fonts/$name" | cut -d' ' -f1)
            if [ "$a" = "$b" ]; then
              echo "ok    $name  ${a:0:12}"
            else
              echo "::error file=docs/fonts/$name::docs/fonts/$name is ${b:0:12}, fonts/$name is ${a:0:12} -- run 'python3 docs/system/build.py --linked' and commit docs/"
              fail=1
            fi
          done
          exit $fail
