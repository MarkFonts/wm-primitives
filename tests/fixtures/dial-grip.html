<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><title>wmDial grip</title>
<link rel="stylesheet" href="/dial/shared/src/color.css"><link rel="stylesheet" href="/dial/shared/src/type.css"><link rel="stylesheet" href="/dial/shared/src/motion.css">
<link rel="stylesheet" href="/dial/shared/dist/dial.css">
<style>:root{--ui-font:system-ui;--text-rgb:232,232,232} body{background:var(--bg);color:var(--text);padding:24px;width:360px}
 #t{display:flex;flex-direction:column;gap:6px} #a{display:flex;flex-direction:column;gap:6px;margin-top:16px;--accent:#ff4fa3}</style>
</head><body>
<div id="t"></div><div id="a"></div>
<script src="/dial/shared/dist/dial.js"></script>
<script>
  for (const [host, ids] of [['t', [0, 37, 100]], ['a', [37]]]) for (const v of ids) {
    const el = document.createElement('div'); document.getElementById(host).appendChild(el)
    wmDial.mount(el, { label: 'Weight', value: v, min: 0, max: 100, step: 1, variant: 'track', onChange() {} })
  }
</script></body></html>
